Version: 1.2

# Gran Turismo 5 (US, BCUS98114) - rendering fixes
# Copy this file to the RPCS3 "patches" folder, then enable the patch in Manage > Game Patches.

PPU-3ebfa15ea6c3d4c91c81edc4fb33a6b6cc62b87b:
  "Disable Shadow Optimize (bumper cam darkening fix)":
    Games:
      "Gran Turismo 5":
        BCUS98114: [ 02.17 ]
    Author: "Cue-System90"
    Patch Version: 1.0
    Group: ""
    Notes: "Fixes the track turning dark in bumper cam while no other car is in view (for example when leading at Tsukuba). The shadow map depth range is normally fitted to the visible cars; with none in view the fit is skipped and a stale range stays active. This patch always uses the course's static shadow range. Shadows can be slightly less sharp. Ported from the EU 02.11 patch by code signature (same function, shifted by 0x2144); not yet tested in-game."
    Patch:
      - [ be32, 0x008BBAA0, 0x3A200000 ] # li r17, 0     (was mr r17, r3: shadowOptimize flag)
      - [ be32, 0x008BBAA8, 0x38000000 ] # li r0, 0      (was clrlwi r0, r17, 24): skip caster fitting
